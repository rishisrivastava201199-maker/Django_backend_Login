
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:#f2f5f9;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .login-box{
            width:380px;
            background:#fff;
            padding:35px;
            border-radius:10px;
            box-shadow:0 0 15px rgba(0,0,0,.15);
        }

        h2{
            text-align:center;
            margin-bottom:25px;
        }

        .input-box{
            margin-bottom:18px;
        }

        label{
            display:block;
            margin-bottom:6px;
            font-weight:bold;
        }

        input{
            width:100%;
            padding:12px;
            border:1px solid #ccc;
            border-radius:5px;
            font-size:16px;
        }

        button{
            width:100%;
            padding:12px;
            border:none;
            background:#0d6efd;
            color:white;
            font-size:17px;
            border-radius:5px;
            cursor:pointer;
        }

        button:hover{
            background:#0b5ed7;
        }

        .error{
            color:red;
            margin-bottom:15px;
            text-align:center;
        }

        .success{
            color:green;
            margin-bottom:15px;
            text-align:center;
        }
    </style>
</head>

<body>

<div class="login-box">

    <h2>Login</h2>

    {% if messages %}
        {% for message in messages %}

            <div class="{{ message.tags }}">
                {{ message }}
            </div>

        {% endfor %}
    {% endif %}

    <form method="POST">

        {% csrf_token %}

        <div class="input-box">

            <label>Username</label>

            <input
                type="text"
                name="username"
                placeholder="Enter Username"
                required
            >

        </div>

        <div class="input-box">

            <label>Password</label>

            <input
                type="password"
                name="password"
                placeholder="Enter Password"
                required
            >

        </div>

        <button type="submit">
            Login
        </button>

    </form>

</div>

</body>
</html>
